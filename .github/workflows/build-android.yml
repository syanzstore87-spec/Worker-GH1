name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      payload:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Parse payload & download ZIP
        run: |
          echo '${{ inputs.payload }}' > payload.json
          ZIP_URL=$(jq -r '.zipAssetUrl // empty' payload.json)
          if [ -n "$ZIP_URL" ]; then
            curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" "$ZIP_URL" -o project.zip
            unzip -o project.zip -d project/
          fi

      - name: Make gradlew executable
        run: chmod +x project/gradlew

      - name: Build APK
        run: |
          cd project
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: project/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
